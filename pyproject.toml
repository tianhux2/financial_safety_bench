[project]
name = "financial-safety-bench"
version = "0.2.0"
description = "Financial Agent Safety Bench: Adversarial Robustness Assessment for Tool-Using Financial Agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

dependencies = [
    "aiohttp>=3.9.0",
    "backoff>=2.2.1",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "sec-api>=1.0.32",
    "model-library>=0.1.0",
    "tavily-python>=0.5.0",
    "simpleeval>=1.0.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finance_agent", "safety_bench"]

[dependency-groups]
dev = [
  "ruff",
  "pytest",
]

[project.scripts]
safety-bench = "safety_bench.run:main"
finance-agent = "finance_agent.run_agent:main_sync"
frontier-agent = "finance_agent.cli:main"

[tool.basedpyright]
exclude = [
  "data/*",
  ".*",
]
typeCheckingMode = "basic"
reportExplicitAny = false
